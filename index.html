<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <!--app-head-->
    <!-- Applies the saved presentation mode before first paint. The
         page is prerendered in personal mode, so without this a
         recruiter-mode visitor sees the full Japanese layout flash up
         and then collapse once React hydrates. -->
    <script>
      try {
        // ?mode= wins and is remembered, so a link in an email can choose
        // which presentation the visitor lands in. Read before paint for
        // the same reason as the stored value: after paint is a flash.
        var q = new URLSearchParams(location.search).get('mode')
        if (q === 'personal' || q === 'recruiter') {
          localStorage.setItem('mizu-mode', q)
        }
        if (localStorage.getItem('mizu-mode') === 'recruiter') {
          document.documentElement.classList.add('mode-recruiter')
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Shippori Mincho carries the vertical hackathon spine. Google
         serves CJK families in unicode-range chunks, so only the block
         holding the few katakana actually used is ever downloaded. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&family=Shippori+Mincho:wght@500;800&family=Chakra+Petch:wght@600;700&family=Bangers&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <style>
        /* Reveal animations are JS-driven — without JS the prerendered
           content would sit at opacity 0. Show everything instead. */
        .reveal { opacity: 1 !important; transform: none !important; }
        .hero-enter { animation: none !important; opacity: 1 !important; }
      </style>
    </noscript>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
